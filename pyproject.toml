[project]
name = "terraform-version-detector"
readme = "README.md"
version = "0.1.0"
description = "Terraform required_version detector for GitHub Actions."
maintainers = [
  {name = "skokado", email = "terutacchi@gmail.com"},
  {name = "Falcon Taylor-Carter", email = "falcon.taylor-carter@zeronorth.com"},
]

requires-python = ">=3.14"
dependencies = [
    "python-hcl2>=7.3.1, <8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
